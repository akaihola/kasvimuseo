# Continuous integration for kasvimuseo -- issue 018.
#
# This deliberately calls dev/kasvimuseo rather than re-expressing what it does.
# The suite runs inside the project's own Python 2.7 image (no public runtime has
# Django 1.5 and the pinned dependencies), and ylaneenkasvit/common_settings.py
# hardcodes HOST: /var/run/postgresql -- a unix socket directory, not a TCP host.
# A PostgreSQL service container would therefore need a settings change to be
# reachable at all, while the script already starts a throwaway cluster and
# bind-mounts its socket directory into the container. So CI does what a
# developer does, and the two cannot drift apart.
#
# The tests build their own data: no production dump and no `media fetch`.
# test_settings points MEDIA_ROOT at a throwaway path, so nothing reads a photo.

name: tests

# A bare `push:` alongside `pull_request:` runs everything twice while a pull
# request is open, because a branch with a PR on it matches both. Limiting the
# push trigger to the integration branch gives exactly one run per event: the
# pull request builds the merge commit while it is open, and master builds
# again once something lands on it.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  suite:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two things the runner does not give dev/kasvimuseo for free. Ubuntu ships
      # PostgreSQL's server binaries -- initdb and pg_ctl, which `db start` calls
      # -- outside PATH, and a non-login shell leaves $USER unset, which the
      # script reads under `set -u`. Both are properties of the runner, not of
      # the project, which is why they are fixed here and not in the script.
      - name: Prepare the runner for dev/kasvimuseo
        run: |
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" \
              >> "$GITHUB_PATH"
          echo "USER=$(id -un)" >> "$GITHUB_ENV"

      # About 80 seconds from scratch, most of it compiling Pillow and psycopg2
      # against musl. Not cached: a cache keyed on the build inputs would save
      # roughly a minute per run and is worth adding if that ever matters, but it
      # is machinery to maintain for a two-minute pipeline.
      - name: Build the Python 2.7 image
        run: dev/kasvimuseo app build

      # Starts the cluster, runs pytest against it, stops it again. About 25
      # seconds for the whole suite.
      - name: Run the suite
        run: dev/kasvimuseo app test

  # The label editor's behaviour, which only exists in a browser (issue 017).
  # Its own job rather than a step in the one above, so a drag-and-drop
  # regression and a model regression arrive as two different red lights, and
  # so the fast unit signal is not held up by a browser.
  #
  # It repeats `app build`, which is the price of that: the two jobs share no
  # machine. About two and a half minutes in all -- the image, Playwright's
  # Chromium, then the suite -- against the pytest job's one, and it runs
  # alongside rather than after.
  #
  # `playwright install` is what fetches the browser here. It is deliberately
  # not in `dev/kasvimuseo`: a development machine already has one, and a
  # script that downloads 150 MB behind your back is not a script anybody
  # should have to read twice. PLAYWRIGHT_BROWSERS_PATH overrides where it
  # comes from.
  browser:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The same two runner fixups as the pytest job: `app browser-test` starts
      # the same cluster through the same script.
      - name: Prepare the runner for dev/kasvimuseo
        run: |
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" \
              >> "$GITHUB_PATH"
          echo "USER=$(id -un)" >> "$GITHUB_ENV"

      - name: Build the Python 2.7 image
        run: dev/kasvimuseo app build

      - name: Install Playwright's Chromium
        run: |
          uv run --no-project \
              --with-requirements browser_tests/requirements.txt \
              playwright install --with-deps chromium

      - name: Run the browser tests
        run: dev/kasvimuseo app browser-test

  # Warnings are errors and docs/issues/next.rst is generated from the issue
  # files' metadata, so this fails on a malformed :Status:, an issue missing from
  # the ranking, or a broken cross-reference -- the class of mistake that is
  # otherwise found by whoever next builds the docs. It shares nothing with the
  # job above: the host's Python 3 through uv, no container and no database, so
  # it costs about 20 seconds and runs in parallel.
  #
  # `--clean` throws away any previous output and doctrees first. On a hosted
  # runner there are none -- every run starts from a fresh checkout -- so this
  # buys nothing today and is here to say what the job depends on: an
  # incremental Sphinx build re-reads only what changed, and would go quiet
  # about a warning in a page the branch never touched. The day anything caches
  # .dev/docs between runs to save the 25 seconds, the flag is what keeps that
  # from turning the check into a rubber stamp.
  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build the documentation
        run: dev/kasvimuseo docs --clean

      # Only what landed on master is ever published, so a pull request builds
      # the documentation and fails on a warning without deploying anything.
      # The condition is on the upload rather than only on the deploy job so a
      # pull request does not carry a 12 MB artifact nobody will read.
      - name: Package the HTML for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .dev/docs/html

  # Publishing the site the sphinx job just built (issue 038). Separate job
  # because deploying wants permissions -- `pages: write` and `id-token: write`
  # -- that the build has no business holding, and because a deployment belongs
  # to an environment while a build does not.
  #
  # This is dormant until somebody with repository settings sets Pages -> Source
  # to "GitHub Actions"; no workflow can do that, and turning it on is the
  # maintainer's decision rather than this file's. Until then the API says the
  # repository has no Pages site, the deploy is skipped with a notice, and the
  # run stays green -- rather than every push to master going red over a switch
  # that has not been flipped. Once it is flipped this job starts publishing
  # with no change here.
  publish:
    name: pages
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages switched on for this repository?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Pages is not enabled: set Settings -> Pages ->" \
                   "Source to 'GitHub Actions' to publish the documentation." \
                   "See README.rst."
          fi

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
