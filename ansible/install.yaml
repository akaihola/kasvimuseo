---
- name: Install Kasvimuseo and dependencies
  hosts: all
  remote_user: "{{ app_user }}"
  vars_files:
    - vars/main.yml

  tasks:
    # The application's secrets are not in this repository (issue 025). They
    # live in the Ansible Vault file for the host, ansible/host_vars/<host>,
    # which is decrypted with ansible/get-vault-password.sh:
    #
    #     kasvimuseo_secret_key: ...
    #     kasvimuseo_db_password: ...
    #
    # Fail here, before anything is installed, rather than deploy an
    # application that cannot start or a database user with an empty password.
    - name: Check that the secrets are in the vault
      # Every tag whose tasks need one of the two values: collectstatic imports
      # the settings, the database user is created with the password, and
      # uwsgi.ini carries both. `backup`, `restore` and `media` are left out on
      # purpose -- taking a dump needs neither.
      tags:
        - code
        - static
        - database
        - web
        - uwsgi
      assert:
        that:
          - kasvimuseo_secret_key is defined
          - kasvimuseo_secret_key | length > 0
          - kasvimuseo_db_password is defined
          - kasvimuseo_db_password | length > 0
        msg: >-
          kasvimuseo_secret_key and kasvimuseo_db_password must be defined in
          the vaulted host_vars file for this host. Add them with
          `ansible-vault edit ansible/host_vars/{{ inventory_hostname }}`.
          Neither value is in the repository, and the old committed ones should
          not be reused -- see
          docs/issues/025-production-secret-key-and-database-password-are-committed.rst.

    - name: Install Python 2.7
      tags:
        - python
      apt:
        name: python-minimal
        state: present
      become: yes

    - name: Install pip 19.3.1 with a patch for issue 5780
      tags:
        - python
      pip:
        name: https://github.com/rouge8/pip/archive/gh-5780.zip
        extra_args: "--user"

    - name: Remove OS package of old pip for Python 2.7
      tags:
        - python
      apt:
        name: python-pip
        state: absent
      become: yes

#    - name: Download new pip for Python 2.7
#      tags:
#        - python
#      get_url:
#        url: https://bootstrap.pypa.io/get-pip.py
#        dest: /tmp/
#
#    - name: Install new pip for Python 2.7
#      tags:
#        - python
#      command: python2.7 /tmp/get-pip.py --user

    - name: Install the Kasvimuseo application
      tags:
        - code
      pip:
        executable: "/home/{{ app_user }}/.local/bin/pip2"
        name: "git+ssh://git@bitbucket.org/akaihola/kasvimuseo.git"
        state: latest
        extra_args: "--user"

    - name: Create static assets directory
      tags:
        - code
        - static
      become: true
      file:
        path: /www/ylaneenkasvit
        state: directory
        owner: "{{ app_user }}"
        group: www-data
        mode: 06770

    - name: Make manage.py executable
      tags:
        - code
        - static
      file:
        path: "{{ django_dir }}/manage.py"
        mode: 0775

    - name: Collect static assets
      tags:
        - code
        - static
      django_manage:
        command: collectstatic
        app_path: "{{ django_dir }}"
        settings: ylaneenkasvit.ylaneenkasvit_settings
      # Importing the settings needs both secrets, so any manage.py command run
      # from here needs them in its environment too (issue 025) -- and the host
      # names, which the settings insist on for the same reason (issue 026).
      environment:
        KASVIMUSEO_SECRET_KEY: "{{ kasvimuseo_secret_key }}"
        KASVIMUSEO_DB_PASSWORD: "{{ kasvimuseo_db_password }}"
        KASVIMUSEO_ALLOWED_HOSTS: "{{ kasvimuseo_allowed_hosts | join(',') }}"
      no_log: true

    - name: Install PostgreSQL
      tags:
        - database
      become: yes
      import_role:
        name: geerlingguy.postgresql

    - name: Add Postgis extension
      tags:
        - database
        - postgis
      become: true
      become_user: "{{ postgresql_user }}"
      postgresql_ext:
        name: postgis
        db: ylaneenkasvit

    - name: Copy database backup to host
      tags:
        - database
        - restore
      copy:
        src: "{{ database_backup_to_restore }}"
        dest: /tmp/backup.sql
      when: database_backup_to_restore is defined

    - name: Restore database from backup
      tags:
        - database
        - restore
      become: true
      become_user: "{{ postgresql_user }}"
      postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner | default(postgresql_user) }}"
        state: restore
        target: /tmp/backup.sql
      when: database_backup_to_restore is defined
      with_items: "{{ postgresql_databases }}"

    - name: Back up the database
      tags:
        - database
        - backup
      become: true
      become_user: "{{ postgresql_user }}"
      postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner | default(postgresql_user) }}"
        state: dump
        target: /tmp/backup.sql
      when: backup_database is defined
      with_items: "{{ postgresql_databases }}"

    - name: Fetch database backup from host
      tags:
        - database
        - backup
      fetch:
        src: /tmp/backup.sql
        dest: "{{ backup_database }}"
      when: backup_database is defined

    - name: Upload media
      tags:
        - media
      become: true
      become_user: "{{ app_user }}"
      synchronize:
        src: ../media
        dest: /www/ylaneenkasvit/
        archive: false
        recursive: true
        rsync_path: /usr/bin/rsync
      when: upload_media is defined

    - name: Install NGINX
      tags:
        - web
        - nginx
      become: yes
      import_role:
        name: nginxinc.nginx

    - name: Configure Certbot
      tags:
        - web
        - certbot
      become: yes
      import_role:
        name: geerlingguy.certbot

    - name: uWSGI
      tags:
        - web
        - uwsgi
      become: yes
      import_role:
        name: akaihola.uwsgi
