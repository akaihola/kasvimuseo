---
- name: Install uWSGI
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - uwsgi
    - uwsgi-plugin-python

- name: Create uWSGI config
  become_user: kasvimuseo
  # It carries the secrets now (issue 025): readable only by the user uWSGI
  # runs as, and not echoed into the play's output or a --diff run.
  template:
    src: uwsgi.ini
    dest: "{{ uwsgi_ini }}"
    owner: kasvimuseo
    mode: 0600
  no_log: true
  register: wsgi_config
  notify:
    - "(Handler: All OSs) Reload NGINX"

- name: Setup systemd service
  template:
    src: uwsgi_systemd
    dest: "/etc/systemd/system/{{ uwsgi_service }}.service"
    owner: root
    group: root
    mode: 0644
  register: wsgi_service
  notify:
    - "(Handler: All OSs) Reload NGINX"

- name: Reload systemd because we've just updated a service
  shell: systemctl daemon-reload
  when: wsgi_service.changed

# Started as well as enabled: with only `enabled`, a host whose uWSGI is down
# stays down for the whole run unless the config happens to change, and the
# verify play fails at its start-time check. The 070 rehearsal hit exactly
# that after an operator stop.
- name: Ensure that the wsgi service is enabled and running
  service: "name={{ uwsgi_service }} enabled=yes state=started"

# We can't use a handler for this, because handlers don't work well with dynamic parameters.
- name: Restart uWSGI service
  service: "name={{ uwsgi_service }} state=restarted"
  when: wsgi_service.changed or wsgi_config.changed
