[uwsgi]
module = ylaneenkasvit.wsgi
# The settings read both secrets from the environment and refuse to start
# without them, so this file -- written from the vault, mode 0600, never
# committed -- is where the running application gets them (issue 025).
env = KASVIMUSEO_SECRET_KEY={{ kasvimuseo_secret_key }}
env = KASVIMUSEO_DB_PASSWORD={{ kasvimuseo_db_password }}
# Not a secret and not vaulted -- kasvimuseo_allowed_hosts is in
# ansible/vars/main.yml -- but it reaches the application the same way, because
# the settings refuse to start without it either (issue 026).
env = KASVIMUSEO_ALLOWED_HOSTS={{ kasvimuseo_allowed_hosts | join(',') }}
socket = {{ uwsgi_socket }}
pidfile = /home/{{ app_user }}/uwsgi.pid
chmod-socket = 660
uid = {{ app_user }}
gid = www-data
processes = 10
plugins = python27,logfile
req-logger = file:/home/{{ app_user }}/uwsgi.access.log
logger = file:/home/{{ app_user }}/uwsgi.error.log
