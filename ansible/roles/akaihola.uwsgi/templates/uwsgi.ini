[uwsgi]
module = ylaneenkasvit.wsgi
socket = {{ uwsgi_socket }}
pidfile = /home/{{ app_user }}/uwsgi.pid
chmod-socket = 660
uid = {{ app_user }}
gid = www-data
processes = 10
plugins = python27,logfile
req-logger = file:/home/{{ app_user }}/uwsgi.access.log
logger = file:/home/{{ app_user }}/uwsgi.error.log
