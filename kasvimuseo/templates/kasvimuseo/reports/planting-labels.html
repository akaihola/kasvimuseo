{% load kasvimuseo_model_tags kasvimuseo_photo_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ object.observation.species.name_fi }}</title>
    <style>
        @media print {
            form { display: none; }
        }
        @page {
            size: A4;
            margin: 0cm;
        }
        body {
            margin: 0px;
            font-family: sans-serif;
        }

        /* settings form */
        input[type=text] {
            width: 3em;
            margin-right: 1em;
        }

        /* one label */
        li {
            position: relative; /* so observation-id can be positioned */
            display: inline-block;
            width: {{ request.GET.width|default:"14cm" }};
            height: {{ request.GET.height|default:"8cm" }};
            list-style: none;
            border: solid gray 1px;
            margin: 0.5cm;
            page-break-inside: avoid;
            overflow: hidden;
        }

        /* photo in label */
        li.horizontal .photo {
            width: 100%;
            height: 60%;
            margin-bottom: 0.2cm;
        }
        li.vertical .photo {
            height: 100%;
            margin-bottom: 0;
            text-align: left;
            float: left;
        }
        li .photo img {
            max-width: 100%;
            max-height: 100%;
        }
        li.horizontal {
            text-align: center;
        }
        h1, p {
            margin: 0;
        }
        li.horizontal h1, li.horizontal p {
            line-height: 110%;
        }
        li.vertical h1, li.vertical p {
            line-height: 150%;
        }
        .fit-wrapper {
            /* wrapper around text which will be fit */
            margin: 0 0.3cm;
        }
        h1 {
            /* Finnish name of the species */
            display: block;
            text-transform: uppercase;
            font-size: 30pt;
            width: 100%;
        }
        .classification {
            font-style: italic;
        }
        h1, .classification, .nicknames {
            /* scale these down to fit on one line */
            display: inline-block;
            white-space: nowrap;
        }
        p {
            font-size: 24pt;
        }
        div {
            text-align: center;
            margin: 0;
        }
        .observation-ids {
            font-size: 30pt;
            font-weight: bold;
        }
        .observation-id {
            cursor: move;
            transition: all 0.5s ease-in-out;
        }
        .observation-id:hover {
            transform: rotate(5deg);
            box-shadow: 2px 2px 3px 3px rgba(0, 0, 0, 0.5);
        }
        li.horizontal .observation-ids {
            position: absolute;
            right: 0.5cm;
            text-align: right;
            width: 2cm;
            bottom: 40%;
        }
        li.vertical .observation-ids {
            float: right;
            margin-right: 0.5cm;
        }
    </style>
    <script src="https://unpkg.com/vue"></script>
    <script src="{{ STATIC_URL }}js/kasvimuseo/fitty.min.js"></script>
</head>
<body>
    <div id="app">
        <form method="GET" action=".">
            <label for="width">Box width:</label>
            <input type="text" placeholder="14cm" name="width">
            <label for="height">Box height:</label>
            <input type="text" placeholder="8cm" name="height">
            <input type="submit" value="Set box size">
        </form>
        <ul id="labels"
            @dragenter="dragEnterBackground"
            @dragexit="dragExitBackground"
            ondragover="return false"
            @drop="dropNewLabel">
            <li v-for="species in object_list"
                :data-species-id="species.id"
                @dragenter="dragEnterLabel"
                @dragexit="dragExitLabel"
                @dragover="dragOverLabel"
                @drop="dropLabel">
                <observation-ids :ids="species.external_ids"
                                 v-on:remove-label-at-index="removeLabel"></observation-ids>
                <photo :url="species.photo"></photo>
                <name :name="species.name_fi"></name>
                <classification :genus="species.genus"
                                :group="species.group"
                                :species="species.species"
                                :subspecies="species.subspecies"></classification>
            </li>
        </ul>
    </div>

    <script type="text/javascript">
        const dragMixin = {
            methods: {
                labelSpeciesId: function(target) {
                    const label = target.closest('li');
                    return parseInt(label.dataset.speciesId);
                },
                setDragData: function(event, index, externalId, speciesId) {
                    event.dataTransfer.setData('text/plain:index', index);
                    event.dataTransfer.setData('text/plain:externalId', externalId);
                    event.dataTransfer.setData('text/plain:speciesId', speciesId);
                },
                getDragData: function(event) {
                    return {
                        index: parseInt(event.dataTransfer.getData('text/plain:index')),
                        externalId: parseInt(event.dataTransfer.getData('text/plain:externalId')),
                        speciesId: parseInt(event.dataTransfer.getData('text/plain:speciesId'))
                    };
                },
                getLabelData: function(event) {
                    const node = event.target,
                        el = (node.nodeType === 1 ? node : node.parentElement),
                        label = el.closest('li')
                    return {
                        index: this.getElIndex(label),
                        speciesId: parseInt(label.dataset.speciesId)
                    }
                },
                getEventData: function(event) {
                    return {
                        drag: this.getDragData(event),
                        target: this.getLabelData(event)
                    }
                },
                dragMatch: function(target, drag) {
                    return target.speciesId === drag.speciesId &&
                        target.index !== drag.index;
                },
                dragStart: function(event) {
                    const index = this.getElIndex(event.target.closest('li')),
                        externalId = parseInt(event.target.innerHTML),
                        speciesId = this.labelSpeciesId(event.target);
                    this.setDragData(event, index, externalId, speciesId);
                    event.dataTransfer.effectAllowed = "move";
                    event.target.style.border = 'solid black 1px';
                    Vue.nextTick(() => {
                        const externalIds = this.ids,
                            externalIdIndex = externalIds.indexOf(externalId);
                        externalIds.splice(externalIdIndex, 1);
                        event.target.style.border = 'none';
                    });
                },
                dragEnd: function(event) {
                    const drag = this.getDragData(event);
                    if (event.dataTransfer.dropEffect === 'none') {
                        // drag&drop was cancelled, restore the external ID
                        this.ids.push(drag.externalId);
                    } else if (this.ids.length === 0) {
                        // no external IDs left, remove the label
                        this.$emit('remove-label-at-index', drag.index);
                    }
                },
                removeLabel: function(index) {
                    this.object_list.splice(index, 1);
                },
                dragEnterBackground: function(event) {
                    // when an external ID being dragged enters the background
                    // area, show a "new label" indicator
                    if (event.target.id === 'labels') {
                        event.preventDefault();
                        // TODO: show "new label" indicator
                        event.dropEffect = 'move';
                    }
                },
                dragExitBackground: function(event) {
                    // when an external ID being dragged exits the background
                    // area, hide the "new label" indicator
                    if (event.target.nodeType === 1) {
                        // TODO: hide "new label" indicator
                    }
                },
                dragEnterLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                        this.object_list[e.target.index].external_ids.push(e.drag.externalId);
                    }
                },
                dragExitLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        const externalIds = this.object_list[e.target.index].external_ids;
                        externalIds.splice(externalIds.indexOf(e.drag.externalId), 1);
                    }
                },
                dragOverLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                    }
                },
                dropLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                    }
                },
                getElIndex: function(el) {
                    for (var i = 0; el = el.previousElementSibling; i++);
                    return i;
                },
                dropNewLabel: function(event) {
                    event.preventDefault();
                    const drag = this.getDragData(event),
                        that = this,
                        newLabel = JSON.parse(JSON.stringify(this.object_list[drag.index]));
                    this.object_list.splice(drag.index + 1, 0, newLabel);
                    newLabel.external_ids.splice(0);
                    newLabel.external_ids.push(drag.externalId);
                    // force refresh layout of the new label:
                    this.$set(newLabel, 'photo', newLabel.photo);
                }
            }
        };

        const vm = new Vue({
            delimiters: ['[[', ']]'],
            el: '#app',
            mixins: [dragMixin],
            components: {
                'observation-ids': {
                    props: ['ids'],
                    delimiters: ['[[', ']]'],
                    mixins: [dragMixin],
                    template:
                    '<div class="observation-ids">' +
                    '    <p v-for="(id, index) in ids"' +
                    '       class="observation-id"' +
                    '       draggable="true"' +
                    '       @dragstart="dragStart"' +
                    '       @dragend="dragEnd">' +
                    '        [[ id ]]' +
                    '    </p>' +
                    '</div>'
                },
                'name': {
                    props: ['name'],
                    delimiters: ['[[', ']]'],
                    template:
                    '<div class="fit-wrapper">{# dummy wrapper needed for fitty due to centering #}' +
                    '    <h1 class="name">' +
                    '        [[ name ]]' +
                    '    </h1>' +
                    '</div>'
                },
                'classification': {
                    props: ['genus', 'group', 'species', 'subspecies'],
                    delimiters: ['[[', ']]'],
                    template:
                    '<div class="fit-wrapper">{# dummy wrapper needed for fitty due to centering #}' +
                    '    <p class="classification">' +
                    '        [[ genus ]]' +
                    '        [[ group ]]' +
                    '        [[ species ]]' +
                    '        [[ subspecies ]]' +
                    '    </p>' +
                    '</div>'
                },
                'photo': {
                    'props': ['url'],
                    template:
                    '<div class="photo">' +
                    '    <img :src="url" @load="photoLoaded" v-on:layout="photoLoaded" />' +
                    '</div>',
                    methods: {
                        photoLoaded: function(event) {
                            const img = event.target,
                                aspectRatio = img.width / img.height,
                                label = img.closest('li'),
                                orientation = aspectRatio < 3.1 / 4 ? 'vertical' : 'horizontal';
                            let newWidth;
                            label.className = orientation;
                            if (orientation === 'vertical') {
                                const imgWidth = img.offsetWidth;
                                newWidth = `calc(${imgWidth}px + 0.3cm)`;
                            }
                            for (let fitText of label.querySelectorAll('.fit-wrapper')) {
                                if (orientation === 'vertical') {
                                    fitText.style.marginLeft = newWidth;
                                } else {
                                    fitText.style.marginLeft = '0.3cm';
                                }
                                Vue.nextTick(function() {
                                    const el = this;
                                    el.style.fontSize = '';
                                    const style = window.getComputedStyle(el, null),
                                        fontSize = parseFloat(style.getPropertyValue('font-size'));
                                    fitty(el, {maxSize: fontSize});
                                }, fitText.firstChild);
                            }
                        }
                    }
                }
            },
            data: {{ vue_data|safe }}
        });
    </script>
</body>
</html>
