{% load kasvimuseo_model_tags kasvimuseo_photo_tags %}
<!DOCTYPE html>
<!--suppress HtmlUnknownAttribute, HtmlUnknownTag -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ STATIC_URL }}img/favicon.ico">
    <title>{{ object.observation.species.name_fi }}</title>
    <!--suppress CssUnusedSymbol -->
    <style>
        @media print {
            form, .hidden { display: none; }
        }
        @page {
            size: A4;
            margin: 0cm;
        }
        body {
            margin: 0px;
            font-family: sans-serif;
        }

        /* settings form */
        input[type=text] {
            width: 3em;
            margin-right: 1em;
        }

        /* one label */
        li {
            position: relative; /* so observation-id can be positioned */
            display: inline-block;
            width: {{ request.GET.width|default:"14cm" }};
            height: {{ request.GET.height|default:"8cm" }};
            list-style: none;
            border: solid gray 1px;
            margin: 0.5cm;
            page-break-inside: avoid;
            overflow: hidden;
        }
        li.hidden {
            opacity: 0.3;
        }
        li.hidden:hover .remove {
            opacity: 1;
        }

        /* photo in label */
        li.horizontal .photo {
            height: 60%;
            margin-bottom: 0.2cm;
        }
        li.vertical .photo {
            height: 100%;
            margin-bottom: 0;
            text-align: left;
            float: left;
        }
        li .photo img {
            max-width: 100%;
            max-height: 100%;
        }
        .photo-wrapper {
            display: inline-block;
            position: relative;
            height: 100%;
        }
        .photo-chooser {
            position: absolute;
            top: 0;
            background: rgba(255, 255, 255, .3);
            border: none;
            font-weight: bold;
            font-size: 50px;
            padding: 0 12px 8px 12px;
        }
        .photo-chooser:hover {
            background: rgba(255, 255, 255, .7);
        }
        .photo-chooser.previous {
            left: 0;
        }
        .photo-chooser.next {
            right: 0;
        }
        li.horizontal {
            text-align: center;
        }
        h1, p {
            margin: 0;
        }
        li.horizontal h1, li.horizontal p {
            line-height: 110%;
        }
        li.vertical h1, li.vertical p {
            line-height: 150%;
        }
        .fit-wrapper {
            /* wrapper around text which will be fit */
            margin: 0 0.3cm;
        }
        h1 {
            /* Finnish name of the species */
            display: block;
            text-transform: uppercase;
            font-size: 30pt;
            width: 100%;
        }
        .classification {
            font-style: italic;
        }
        h1, .classification, .nicknames {
            /* scale these down to fit on one line */
            display: inline-block;
            white-space: nowrap;
        }
        p {
            font-size: 24pt;
        }
        div {
            text-align: center;
            margin: 0;
        }
        .observation-ids {
            font-size: 30pt;
            font-weight: bold;
        }
        .observation-id {
            cursor: move;
            transition: all 0.5s ease-in-out;
        }
        li:hover .observation-id {
            transform: rotate(5deg);
            box-shadow: 2px 2px 3px 3px rgba(0, 0, 0, 0.5);
        }
        li.horizontal .observation-ids {
            position: absolute;
            right: 0.5cm;
            text-align: right;
            width: 2cm;
            bottom: 40%;
        }
        li.vertical .observation-ids {
            float: right;
            margin-right: 0.5cm;
        }
        .remove {
            font-size: 30pt;
            position: absolute;
            right: 5px;
            bottom: 0;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }
        .remove * {
            cursor: pointer;
        }
        li:hover .remove {
            opacity: 0.5;
            cursor: pointer;
        }
        li .remove:hover {
            opacity: 1;
            transition: all 0s;
        }
        #drag-wrapper {
            transform: scale(0.25);
            transform-origin:top left;
            border: solid black 4px;
            padding: 0;
            position: absolute;
            z-index: -1; /* prevent drag enter and flickering */
            background: white;
        }
    </style>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/vue"></script>
    <script src="{{ STATIC_URL }}js/kasvimuseo/fitty.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="drag-wrapper"
             v-show="dragSpecies.visible"
             :style="mouse">
            <species-label :species="dragSpecies"></species-label>
        </div>
        <form method="GET" action=".">
            <label for="width">Box width:</label>
            <input type="text" placeholder="14cm" name="width">
            <label for="height">Box height:</label>
            <input type="text" placeholder="8cm" name="height">
            <input type="submit" value="Set box size">
        </form>
        <ul id="labels"
            @dragenter="dragEnterBackground"
            @dragover="dragOverBackground"
            @drop.prevent="dropNewLabel">
            <template v-for="species in object_list">
                <species-label :species="species"
                               @dragenter.stop.native="dragEnterLabel"
                               @dragover.stop.native="allowDropOnLabel"
                               @drop.stop.native="dragDropOnLabel"></species-label>
            </template>
        </ul>
    </div>

    <!--suppress StatementWithEmptyBodyJS, JSUnusedGlobalSymbols, JSUnresolvedFunction, JSUnusedLocalSymbols, JSUnresolvedVariable -->
    <script type="text/javascript">
        const dragMixin = {
            methods: {
                setDragInfo: function(event, data) {
                    window.dragData = data;
                    return window.dragData;
                },
                getDragInfo: function() {
                    return window.dragData;
                },
                getLabelData: function(node) {
                    const el = (node.nodeType === 1 ? node : node.parentElement),
                        label = el.closest('li');
                    return {
                        index: this.getElIndex(label),
                        speciesId: parseInt(label.dataset.speciesId)};
                },
                canDropToLabel: function(event) {
                    const drag = this.getDragInfo(),
                        target = this.getLabelData(event.target);
                    return target.speciesId === drag.speciesId &&
                        target.index !== drag.index;
                },
                getElIndex: function(el) {
                    for (var i = 0; el = el.previousElementSibling; i++);
                    return i;
                },
                insort: function(items, newItem) {
                    for (var i = 0; i < items.length && items[i] < newItem; ++i);
                    items.splice(i, 0, newItem);
                    return items;
                }
            }
        };

        const fitMixin = {
            methods: {
                fitTextToSpace: function() {
                    const el = this.$el.firstChild;
                    el.style.fontSize = '';
                    const style = window.getComputedStyle(el, null),
                        fontSize = parseFloat(style.getPropertyValue('font-size'));
                    fitty(el, {maxSize: fontSize});
                }
            }
        };

        const bus = new Vue();

        const labelComponents = {
            'observation-ids': {
                name: 'observation-ids',
                props: ['ids'],
                data: function() {
                    return {draggedExternalId: null};
                },
                delimiters: ['[[', ']]'],
                mixins: [dragMixin],
                template:
                '<div class="observation-ids">' +
                '    <p v-for="(id, index) in ids"' +
                '       class="observation-id"' +
                '       draggable="true"' +
                '       @dragstart="dragStart"' +
                '       @dragend="dragEnd">' +
                '        [[ id ]]' +
                '    </p>' +
                '</div>',
                methods: {
                    dragStart: function(event) {
                        const label = this.getLabelData(event.target),
                            externalId = parseInt(event.target.innerHTML);
                        this.setDragInfo(
                            event,
                            {
                                index: label.index,
                                externalId: externalId,
                                speciesId: label.speciesId,
                                state: 'dragging',
                                lastLabelIndex: label.index
                            });
                        event.dataTransfer.setData('text/plain', 'drag');
                        event.dataTransfer.effectAllowed = "move";
                        bus.$emit('set-drag-label', label.index, externalId);
                    },
                    dragEnd: function(event) {
                        // event.target is null when dragging to another label!
                        const drag = this.getDragInfo();
                        if (drag.state === 'dragging' && drag.index !== drag.lastLabelIndex) {
                            // Drop to another label was not authorized,
                            // restore external ID on the original label.
                            this.insort(this.ids, drag.externalId);
                        } else if (drag.state === 'dropped' && this.ids.length === 0) {
                            // The last remaining external ID was moved out of
                            // a label to another label of the same species.
                            // Remove the label.
                            bus.$emit('remove-label-at-index', drag.index);
                        }
                    }
                }
            },
            'name': {
                props: ['name', 'verticalPhotoWidth'],
                delimiters: ['[[', ']]'],
                template:
                '<div class="fit-wrapper"' +
                '     v-bind:style="{ marginLeft: verticalPhotoWidth }">{# dummy wrapper needed for fitty due to centering #}' +
                '    <h1 class="name">' +
                '        [[ name ]]' +
                '    </h1>' +
                '</div>',
                mixins: [fitMixin],
                watch: {
                    verticalPhotoWidth: function() {
                        this.fitTextToSpace();
                    }
                }
            },
            'classification': {
                props: ['genus', 'species', 'group', 'subspecies', 'verticalPhotoWidth'],
                delimiters: ['[[', ']]'],
                template:
                '<div class="fit-wrapper"' +
                '     v-bind:style="{ marginLeft: verticalPhotoWidth }">{# dummy wrapper needed for fitty due to centering #}' +
                '    <p class="classification">' +
                '        [[ genus ]]' +
                '        [[ species ]]' +
                '        [[ group ]]' +
                '        [[ subspecies ]]' +
                '    </p>' +
                '</div>',
                mixins: [fitMixin],
                watch: {
                    verticalPhotoWidth: function() {
                        this.fitTextToSpace();
                    }
                }
            },
            'photo': {
                'props': ['pk', 'alternatives'],
                template:
                '<div class="photo">' +
                '    <div class="photo-wrapper">' +
                '    <button class="photo-chooser previous"' +
                '            v-if="numAlternatives > 1"' +
                '            v-on:click="previous">&#x2329;</button>' +
                '    <button class="photo-chooser next"' +
                '            v-if="numAlternatives > 1"' +
                '            v-on:click="next">&#x232a;</button>' +
                '    <img :src="url"' +
                '         @load="photoLoaded"' +
                '         v-on:layout="photoLoaded">' +
                '    </img>' +
                '    </div>' +
                '</div>',
                methods: {
                    photoLoaded: function(event) {
                        const img = event.target,
                            aspectRatio = img.width / img.height;
                        this.$emit('aspect', {aspectRatio: aspectRatio});
                    },
                    previous: function(event) {
                        const keys = Object.keys(this.alternatives),
                              oldIndex = keys.indexOf('' + this.pk),
                              len = keys.length,
                              newIndex = (oldIndex - 1 + len) % len;
                        this.$emit('update:pk', keys[newIndex]);
                    },
                    next: function(event) {
                        const keys = Object.keys(this.alternatives),
                              oldIndex = keys.indexOf('' + this.pk),
                              newIndex = (oldIndex + 1) % keys.length;
                        this.$emit('update:pk', keys[newIndex]);
                    }
                },
                computed: {
                    url: function() {
                        return this.alternatives[this.pk];
                    },
                    numAlternatives: function() {
                        return Object.keys(this.alternatives).length;
                    }
                }
            }
        };

        const vm = new Vue({
            delimiters: ['[[', ']]'],
            mixins: [dragMixin],
            el: '#app',
            components: {
                'species-label': {
                    'props': ['species'],
                    delimiters: ['[[', ']]'],
                    mixins: [dragMixin],
                    components: labelComponents,
                    data: () => ({
                        isVertical: false,
                        // Initially set photo space width to zero. This will
                        // change to min. 0.3 cm once the photo is loaded,
                        // which triggers text fitting.
                        verticalPhotoWidth: '0.0cm'}),
                    template:
                    '<li :data-species-id="species.id"' +
                    '    v-bind:class="{ hidden: !species.visible, vertical: isVertical, horizontal: !isVertical }">' +
                    '    <observation-ids :ids="species.external_ids"></observation-ids>' +
                    '    <photo :pk.sync="species.photo_pk"' +
                    '           :alternatives="species.all_photos"' +
                    '           v-on:aspect="setAspect"></photo>' +
                    '    <name :name="species.name_fi"' +
                    '          :verticalPhotoWidth="verticalPhotoWidth"></name>' +
                    '    <classification :genus="species.genus"' +
                    '                    :species="species.species"' +
                    '                    :group="species.group"' +
                    '                    :subspecies="species.subspecies"' +
                    '                    :verticalPhotoWidth="verticalPhotoWidth"></classification>' +
                    '    <div class="remove">' +
                    '         <label for="remove">&#x1f5b6;</label><input type="checkbox" v-model="species.visible">' +
                    '    </div>' +
                    '</li>',
                    methods: {
                        toggleVisible: function(event) {
                            const e = this.getLabelData(event.target);
                            this.species.visible = !this.species.visible;
                        },
                        setAspect: function(payload) {
                            this.isVertical = payload.aspectRatio < 3.1 / 4;
                            const width = payload.aspectRatio * this.$el.offsetHeight;
                            if (this.isVertical) {
                                this.verticalPhotoWidth = `calc(${width}px + 0.3cm)`;
                            } else {
                                this.verticalPhotoWidth = '0.3cm';
                            }
                        }
                    }
                }
            },
            methods: {
                dragEnterBackground: function(event) {
                    // when an external ID being dragged enters the background
                    // area, show a "new label" indicator
                    if (event.target.id === 'labels') {
                        const drag = this.getDragInfo();
                        if (drag.lastLabelIndex >= 0) {
                            // Dragging from a label. For good browser
                            // compatibility, don't rely on drag exit events.
                            // Instead, trigger exit when entering elsewhere.
                            this.dragExitLabel();
                        }
                        event.preventDefault();
                        event.dropEffect = 'move';
                        this.dragSpecies.visible = true;
                        drag.lastLabelIndex = -1;  // background = -1
                    }
                },
                dragExitBackground: function(event) {
                    // When an external ID being dragged exits the background
                    // area, hide the "new label" indicator. This is also
                    // called whenever another element inside the <ul> is
                    // entered (but not on Chrome).
                    if (event.target.nodeType === 1) {
                        this.dragSpecies.visible = false;
                    }
                },
                dragOverBackground: function(event) {
                    if (event.target.id === 'labels') {
                        const x = event.pageX - 95,
                            y = event.pageY - 30;
                        event.preventDefault();
                        this.mouse = `transform: translate(${x}px, ${y}px) scale(0.25);`;
                    }
                },
                dropNewLabel: function(event) {
                    const drag = this.getDragInfo(),
                        newLabel = JSON.parse(JSON.stringify(this.object_list[drag.index]));
                    this.object_list.splice(drag.index + 1, 0, newLabel);
                    newLabel.external_ids.splice(0);
                    this.insort(newLabel.external_ids, drag.externalId);
                    // force refresh layout of the new label:
                    this.$set(newLabel, 'photo', newLabel.photo);
                    this.dragSpecies.visible = false;
                    drag.state = 'dropped';
                },
                dragEnterLabel: function(event) {
                    const drag = this.getDragInfo(),
                        enteredLabel = this.getLabelData(event.target);
                    if (drag.lastLabelIndex === -1) { // background
                        // For good browser compatibility, don't rely on drag
                        // exit events. Trigger them manually when entering
                        // another element.
                        this.dragExitBackground(event);
                    } else if (drag.lastLabelIndex !== enteredLabel.index) {
                        this.dragExitLabel();
                    }
                    if (drag.lastLabelIndex !== enteredLabel.index
                        && enteredLabel.speciesId === drag.speciesId) {
                        // Coming from background or another label, and
                        // dragging the same species as the entered label. Add
                        // the dragged external ID to this label.
                        event.preventDefault();
                        const labelData = this.object_list[enteredLabel.index];
                        this.insort(labelData.external_ids, drag.externalId);
                    }
                    drag.lastLabelIndex = enteredLabel.index;
                },
                dragExitLabel: function() {
                    // Remove the dragged external ID from the label upon exit
                    const drag = this.getDragInfo(),
                        labelData = this.object_list[drag.lastLabelIndex],
                        externalIds = labelData.external_ids;
                    externalIds.splice(externalIds.indexOf(drag.externalId), 1);
                },
                allowDropOnLabel: function(event) {
                    // handler for both ondragover and ondrop for labels
                    if (this.canDropToLabel(event)) {
                        event.preventDefault();
                    }
                },
                dragDropOnLabel: function(event) {
                    // handler for both ondragover and ondrop for labels
                    if (this.canDropToLabel(event)) {
                        event.preventDefault();
                        this.getDragInfo().state = 'dropped';
                    }
                }
            },
            data: {
                object_list: [],
                dragSpecies: {visible: false, all_photos: {}},
                mouse: ''
            },
            created: function() {
                const that = this;
                axios.get('{% url "planting-label-data" %}')
                    .then(response => {
                        this.object_list = response.data.object_list;
                    })
                    .catch(e => {
                        alert('error')
                    });
                bus.$on('remove-label-at-index', function(index) {
                    that.object_list.splice(index, 1);
                });
                bus.$on('set-drag-label', function(index, externalId) {
                    if (index === undefined) {
                        that.dragSpecies.visible = false;
                    } else {
                        that.dragSpecies = JSON.parse(JSON.stringify(that.object_list[index]));
                        that.dragSpecies.external_ids = [externalId];
                        that.dragSpecies.visible = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
