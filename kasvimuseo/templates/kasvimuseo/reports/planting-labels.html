{% load kasvimuseo_model_tags kasvimuseo_photo_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ STATIC_URL }}img/favicon.ico">
    <title>{{ object.observation.species.name_fi }}</title>
    <style>
        @media print {
            form, .hidden { display: none; }
        }
        @page {
            size: A4;
            margin: 0cm;
        }
        body {
            margin: 0px;
            font-family: sans-serif;
        }

        /* settings form */
        input[type=text] {
            width: 3em;
            margin-right: 1em;
        }

        /* one label */
        li {
            position: relative; /* so observation-id can be positioned */
            display: inline-block;
            width: {{ request.GET.width|default:"14cm" }};
            height: {{ request.GET.height|default:"8cm" }};
            list-style: none;
            border: solid gray 1px;
            margin: 0.5cm;
            page-break-inside: avoid;
            overflow: hidden;
        }
        li.hidden {
            opacity: 0.3;
        }
        li.hidden:hover .remove {
            opacity: 1;
        }

        /* photo in label */
        li.horizontal .photo {
            width: 100%;
            height: 60%;
            margin-bottom: 0.2cm;
        }
        li.vertical .photo {
            height: 100%;
            margin-bottom: 0;
            text-align: left;
            float: left;
        }
        li .photo img {
            max-width: 100%;
            max-height: 100%;
        }
        li.horizontal {
            text-align: center;
        }
        h1, p {
            margin: 0;
        }
        li.horizontal h1, li.horizontal p {
            line-height: 110%;
        }
        li.vertical h1, li.vertical p {
            line-height: 150%;
        }
        .fit-wrapper {
            /* wrapper around text which will be fit */
            margin: 0 0.3cm;
        }
        h1 {
            /* Finnish name of the species */
            display: block;
            text-transform: uppercase;
            font-size: 30pt;
            width: 100%;
        }
        .classification {
            font-style: italic;
        }
        h1, .classification, .nicknames {
            /* scale these down to fit on one line */
            display: inline-block;
            white-space: nowrap;
        }
        p {
            font-size: 24pt;
        }
        div {
            text-align: center;
            margin: 0;
        }
        .observation-ids {
            font-size: 30pt;
            font-weight: bold;
        }
        .observation-id {
            cursor: move;
            transition: all 0.5s ease-in-out;
        }
        li:hover .observation-id {
            transform: rotate(5deg);
            box-shadow: 2px 2px 3px 3px rgba(0, 0, 0, 0.5);
        }
        li.horizontal .observation-ids {
            position: absolute;
            right: 0.5cm;
            text-align: right;
            width: 2cm;
            bottom: 40%;
        }
        li.vertical .observation-ids {
            float: right;
            margin-right: 0.5cm;
        }
        .remove {
            font-size: 30pt;
            position: absolute;
            right: 5px;
            bottom: 0;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }
        .remove * {
            cursor: pointer;
        }
        li:hover .remove {
            opacity: 0.5;
            cursor: pointer;
        }
        li .remove:hover {
            opacity: 1;
            transition: all 0s;
        }
        #drag-wrapper {
            transform: scale(0.25);
            transform-origin:top left;
            border: solid black 4px;
            padding: 0;
            position: absolute;
            z-index: -1; /* prevent drag enter and flickering */
            background: white;
        }
    </style>
    <script src="https://unpkg.com/vue"></script>
    <script src="{{ STATIC_URL }}js/kasvimuseo/fitty.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="drag-wrapper"
             v-show="dragSpecies.visible"
             :style="mouse">
            <species-label :species="dragSpecies"></species-label>
        </div>
        <form method="GET" action=".">
            <label for="width">Box width:</label>
            <input type="text" placeholder="14cm" name="width">
            <label for="height">Box height:</label>
            <input type="text" placeholder="8cm" name="height">
            <input type="submit" value="Set box size">
        </form>
        <ul id="labels"
            @dragenter="dragEnterBackground"
            @dragexit="dragExitBackground"
            @dragover="dragOverBackground"
            @drop="dropNewLabel">
            <template v-for="species in object_list">
                <species-label :species="species"
                               @dragenter.native="dragEnterLabel"
                               @dragexit.native="dragExitLabel"
                               @dragover.native="dragOverLabel"
                               @drop.native="dropLabel"></species-label>
            </template>
        </ul>
    </div>

    <script type="text/javascript">
        const dragMixin = {
            methods: {
                labelSpeciesId: function(target) {
                    const label = target.closest('li');
                    return parseInt(label.dataset.speciesId);
                },
                setDragData: function(event, index, externalId, speciesId) {
                    event.dataTransfer.setData('text/plain:index', index);
                    event.dataTransfer.setData('text/plain:externalId', externalId);
                    event.dataTransfer.setData('text/plain:speciesId', speciesId);
                },
                getDragData: function(event) {
                    return {
                        index: parseInt(event.dataTransfer.getData('text/plain:index')),
                        externalId: parseInt(event.dataTransfer.getData('text/plain:externalId')),
                        speciesId: parseInt(event.dataTransfer.getData('text/plain:speciesId'))
                    };
                },
                getLabelData: function(event) {
                    const node = event.target,
                        el = (node.nodeType === 1 ? node : node.parentElement),
                        label = el.closest('li');
                    return {
                        index: this.getElIndex(label),
                        speciesId: parseInt(label.dataset.speciesId)
                    }
                },
                getEventData: function(event) {
                    return {
                        drag: this.getDragData(event),
                        target: this.getLabelData(event)
                    }
                },
                dragMatch: function(target, drag) {
                    return target.speciesId === drag.speciesId &&
                        target.index !== drag.index;
                },
                getElIndex: function(el) {
                    for (var i = 0; el = el.previousElementSibling; i++);
                    return i;
                }
            }
        };

        const fitMixin = {
            methods: {
                fitContent: function() {
                    const el = this.$el.firstChild;
                    el.style.fontSize = '';
                    const style = window.getComputedStyle(el, null),
                        fontSize = parseFloat(style.getPropertyValue('font-size'));
                    fitty(el, {maxSize: fontSize});
                }
            }
        }

        const bus = new Vue();

        const labelComponents = {
            'observation-ids': {
                name: 'observation-ids',
                props: ['ids'],
                delimiters: ['[[', ']]'],
                mixins: [dragMixin],
                template:
                '<div class="observation-ids">' +
                '    <p v-for="(id, index) in ids"' +
                '       class="observation-id"' +
                '       draggable="true"' +
                '       @dragstart="dragStart"' +
                '       @dragend="dragEnd">' +
                '        [[ id ]]' +
                '    </p>' +
                '</div>',
                methods: {
                    dragStart: function(event) {
                        const index = this.getElIndex(event.target.closest('li')),
                            externalId = parseInt(event.target.innerHTML),
                            speciesId = this.labelSpeciesId(event.target);
                        this.setDragData(event, index, externalId, speciesId);
                        event.dataTransfer.effectAllowed = "move";
                        event.target.style.border = 'solid black 1px';
                        bus.$emit('set-drag-label', index, externalId);
                        Vue.nextTick(() => {
                            const externalIds = this.ids,
                                externalIdIndex = externalIds.indexOf(externalId);
                            externalIds.splice(externalIdIndex, 1);
                            event.target.style.border = 'none';
                        });
                    },
                    dragEnd: function(event) {
                        const drag = this.getDragData(event);
                        if (event.dataTransfer.dropEffect === 'none') {
                            // drag&drop was cancelled, restore the external ID
                            this.ids.push(drag.externalId);
                        } else if (this.ids.length === 0) {
                            // no external IDs left, remove the label
                            bus.$emit('remove-label-at-index', drag.index);
                        }
                    },
                }
            },
            'name': {
                props: ['name', 'textMargin'],
                delimiters: ['[[', ']]'],
                template:
                '<div class="fit-wrapper"' +
                '     v-bind:style="{ marginLeft: textMargin }">{# dummy wrapper needed for fitty due to centering #}' +
                '    <h1 class="name">' +
                '        [[ name ]]' +
                '    </h1>' +
                '</div>',
                mixins: [fitMixin],
                watch: {
                    textMargin: function() {
                        this.fitContent();
                    }
                }
            },
            'classification': {
                props: ['genus', 'group', 'species', 'subspecies', 'textMargin'],
                delimiters: ['[[', ']]'],
                template:
                '<div class="fit-wrapper"' +
                '     v-bind:style="{ marginLeft: textMargin }">{# dummy wrapper needed for fitty due to centering #}' +
                '    <p class="classification">' +
                '        [[ genus ]]' +
                '        [[ group ]]' +
                '        [[ species ]]' +
                '        [[ subspecies ]]' +
                '    </p>' +
                '</div>',
                mixins: [fitMixin],
                watch: {
                    textMargin: function() {
                        this.fitContent();
                    }
                }
            },
            'photo': {
                'props': ['url'],
                template:
                '<div class="photo">' +
                '    <img :src="url"' +
                '         @load="photoLoaded"' +
                '         v-on:layout="photoLoaded" />' +
                '</div>',
                methods: {
                    photoLoaded: function (event) {
                        const img = event.target,
                            aspectRatio = img.width / img.height;
                        this.$emit('aspect', {aspectRatio: aspectRatio});
                    }
                }
            }
        };

        const vm = new Vue({
            delimiters: ['[[', ']]'],
            mixins: [dragMixin],
            el: '#app',
            components: {
                'species-label': {
                    'props': ['species'],
                    delimiters: ['[[', ']]'],
                    mixins: [dragMixin],
                    components: labelComponents,
                    data: () => ({
                        isVertical: false,
                        textMargin: '0.3cm'}),
                    template:
                    '<li :data-species-id="species.id"' +
                    '    v-bind:class="{ hidden: !species.visible, vertical: isVertical, horizontal: !isVertical }">' +
                    '    <observation-ids :ids="species.external_ids"></observation-ids>' +
                    '    <photo :url="species.photo_url" v-on:aspect="setAspect"></photo>' +
                    '    <name :name="species.name_fi"' +
                    '          :textMargin="textMargin"></name>' +
                    '    <classification :genus="species.genus"' +
                    '                    :group="species.group"' +
                    '                    :species="species.species"' +
                    '                    :subspecies="species.subspecies"' +
                    '                    :textMargin="textMargin"></classification>' +
                    '    <div class="remove">' +
                    '         <label for="remove">&#x1f5b6;</label><input type="checkbox" v-model="species.visible">' +
                    '    </div>' +
                    '</li>',
                    methods: {
                        toggleVisible: function(event) {
                            const e = this.getLabelData(event);
                            this.species.visible = !this.species.visible;
                            this.$emit('moveLabelToEnd', e.index);
                        },
                        setAspect: function(payload) {
                            this.isVertical = payload.aspectRatio < 3.1 / 4;
                            const width = payload.aspectRatio * this.$el.offsetHeight;
                            if (this.isVertical) {
                                this.textMargin = `calc(${width}px + 0.3cm)`;
                            } else {
                                this.textMargin = '0.3cm';
                            }
                        }
                    }
                }
            },
            methods: {
                dragEnterBackground: function(event) {
                    // when an external ID being dragged enters the background
                    // area, show a "new label" indicator
                    if (event.target.id === 'labels') {
                        event.preventDefault();
                        event.dropEffect = 'move';
                        this.dragSpecies.visible = true;
                    }
                },
                dragExitBackground: function(event) {
                    // when an external ID being dragged exits the background
                    // area, hide the "new label" indicator
                    if (event.target.nodeType === 1) {
                        this.dragSpecies.visible = false;
                    }
                },
                dragOverBackground: function(event) {
                    if (event.target.id === 'labels') {
                        const x = event.pageX - 95,
                            y = event.pageY - 30;
                        event.preventDefault();
                        this.mouse = `transform: translate(${x}px, ${y}px) scale(0.25);`;
                    }
                },
                dropNewLabel: function(event) {
                    event.preventDefault();
                    const drag = this.getDragData(event),
                        that = this,
                        newLabel = JSON.parse(JSON.stringify(this.object_list[drag.index]));
                    this.object_list.splice(drag.index + 1, 0, newLabel);
                    newLabel.external_ids.splice(0);
                    newLabel.external_ids.push(drag.externalId);
                    // force refresh layout of the new label:
                    this.$set(newLabel, 'photo', newLabel.photo);
                    this.dragSpecies.visible = false;
                },
                dragEnterLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                        const label = this.object_list[e.target.index];
                        label.external_ids.push(e.drag.externalId);
                    }
                },
                dragExitLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        const label = this.object_list[e.target.index],
                            externalIds = label.external_ids;
                        externalIds.splice(externalIds.indexOf(e.drag.externalId), 1);
                    }
                },
                dragOverLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                    }
                },
                dropLabel: function(event) {
                    event.stopPropagation();
                    const e = this.getEventData(event);
                    if (this.dragMatch(e.target, e.drag)) {
                        event.preventDefault();
                    }
                },
                moveLabelToEnd: function(event, index) {
                    const label = this.object_list.splice(index, 1)[0];
                    this.object_list.push(label);
                }
            },
            data: Object.assign({{ vue_data|safe }}, {dragSpecies: {visible: false}, mouse: ''}),
            created: function() {
                const that = this;
                bus.$on('remove-label-at-index', function(index) {
                    that.object_list.splice(index, 1);
                });
                bus.$on('set-drag-label', function(index, externalId) {
                    if (index === undefined) {
                        that.dragSpecies.visible = false;
                    } else {
                        that.dragSpecies = JSON.parse(JSON.stringify(that.object_list[index]));
                        that.dragSpecies.external_ids = [externalId];
                        that.dragSpecies.visible = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
