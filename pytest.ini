[pytest]
DJANGO_SETTINGS_MODULE = ylaneenkasvit.test_settings
testpaths = kasvimuseo/tests
python_files = test_*.py *_tests.py

# One ignore, and it is the plugin's warning rather than Django's or ours.
#
# Upgrade plan Stage 7 pairs pytest-django 3.1.2 with pytest 3.10.1. 3.1.2
# reads a test's marks through `MarkInfo`, which pytest 3.6 deprecated and
# pytest 4 removes, so one line of the plugin
# (`site-packages/pytest_django/plugin.py:630`) printed 456 of the 630 warnings
# the first Stage 7 run produced. That buried the 174 that matter: Django's own
# deprecation warnings, which are how Stages 8 and 11 know what they owe.
# Nothing in this repository can fix the plugin's line, and Stage 9 replaces it
# by moving to pytest-django 3.10.0, which calls `node.iter_markers()`. Delete
# this entry in that stage.
#
# Django's warnings are deliberately left visible rather than turned into
# errors: at Stage 7 the suite still prints `patterns()`, `allow_tags` and
# string-view-argument warnings that Stages 8 and 11 are scheduled to clear.
filterwarnings =
    ignore:MarkInfo objects are deprecated
