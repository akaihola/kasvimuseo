# The app is Django 1.5 on Python 2.7 and its dependencies only exist inside
# the dev container (see dev/Containerfile), so a host type checker cannot
# resolve django, photologue, south or PIL. Type checking is not part of this
# project's tooling; this file only keeps editor/hook noise down.
[rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
# The settings modules are layered by ``from .common_settings import *`` and
# then overriding, which is Django's own idiom: ``test_settings`` turning
# ``SESSION_COOKIE_SECURE`` back off for a suite that speaks plain HTTP (issue
# 059) reads as "``Literal[False]`` assigned to ``Literal[True]``" to a checker
# that saw the star import.
invalid-assignment = "ignore"
